name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      ORDERSCOUT_LIVE_LLM_EVAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install verified dependency lock
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check Python source
        run: python -m compileall -q desktop
      - name: Test shared infrastructure and desktop workflows
        working-directory: desktop
        run: >-
          python -m pytest tests/domain_feedback tests/domain_core tests/domain_main
          tests/domain_orders/test_trendyol_orders_api.py
          tests/domain_listing/test_trendyol_listing_api.py
          tests/domain_finance/test_trendyol_finance_api.py
          tests/domain_update
          tests/domain_ai/test_public_xml_safety.py
          tests/domain_ai/test_file_workspace.py
          tests/domain_ai/test_chat_file_attachments.py
          tests/domain_ai/test_web_research.py -q
      - name: Audit pinned dependencies
        run: pip-audit --disable-pip --no-deps -r requirements-dev.lock --progress-spinner off

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan all reachable Git history
        run: /tmp/gitleaks git --log-opts="--all" --redact=100 --config=.gitleaks.toml --no-banner .
